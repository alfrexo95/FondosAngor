name: Fondos Cuba Campaign
on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1,3,5' # Lunes, Miércoles y Viernes a las 15:00 UTC

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
