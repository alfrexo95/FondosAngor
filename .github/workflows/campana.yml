name: Weekly Cuba Campaign

on:
  schedule:
    - cron: '0 22 * * 1' # Todos los Lunes a las 22:00 UTC (6:00 PM en Cuba)
  workflow_dispatch:     # Permite ejecución manual

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Instalar dependencias
        run: pip install websockets
      
      - name: Ejecutar Bot de Nostr
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
        run: python bot.py
      
      - name: Guardar Estado (Auto-Commit)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Siguiente foto en cola"
          file_pattern: 'state.json'
