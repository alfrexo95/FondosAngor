name: Weekly Cuba Campaign

on:
  schedule:
    - cron: '0 22 * * 1' # Todos los Lunes a las 22:00 UTC (6:00 PM en Cuba)
  workflow_dispatch:     # Permite ejecución manual

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets
      - run: python bot.py
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
      - name: Guardar Estado
        run: |
          git config user.name "campaign-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state $(date -u +%F)"
            git pull --rebase
            git push
          fi
